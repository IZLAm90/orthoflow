databases:
  - name: orthoflow-db
    plan: free

services:
  - type: web
    name: orthoflow-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: orthoflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MIN
        value: "10080"
      - key: CORS_ORIGINS
        value: "http://localhost:5173"
